<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhoneストレージ診断 | のり式</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ee;
    --surface: #fff9f4;
    --surface2: #f0e9e0;
    --accent: #b07d5b;
    --accent2: #c9a97a;
    --text: #3a2e26;
    --text-muted: #9c8878;
    --border: #e0d4c8;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeUp 0.6s ease both;
  }

  .header .tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    border-radius: 100px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .header h1 {
    font-size: clamp(24px, 6vw, 36px);
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 12px;
  }

  .header h1 span { color: var(--accent); }

  .header p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .progress-bar {
    height: 3px;
    background: var(--surface2);
    border-radius: 100px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    margin-bottom: 28px;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 24px;
    animation: fadeUp 0.5s ease both;
  }

  .question-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .question-sub {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .choice-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .choice-btn .choice-icon { font-size: 20px; flex-shrink: 0; }
  .choice-btn .choice-label { display: block; }
  .choice-btn .choice-note {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .choice-btn:hover {
    border-color: var(--accent);
    background: #f5ece0;
    transform: translateX(4px);
  }

  .result-card { animation: fadeUp 0.6s ease both; }

  .result-hero {
    background: linear-gradient(135deg, #fff4eb 0%, #f5e6d5 100%);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 36px 28px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .result-hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(176,125,91,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .result-emoji {
    font-size: 52px;
    margin-bottom: 12px;
    display: block;
    animation: bounce 0.6s 0.3s ease both;
  }

  .result-type {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .result-title {
    font-size: 24px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 14px;
    white-space: pre-line;
  }

  .result-desc {
    font-size: 14px;
    color: #5a4035;
    line-height: 1.8;
    text-align: left;
  }

  .calc-box {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  .calc-box h3 {
    font-size: 14px;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .calc-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    gap: 12px;
  }

  .calc-row:last-child { border-bottom: none; }
  .calc-row .label { color: var(--text-muted); flex: 1; line-height: 1.5; }
  .calc-row .value { font-weight: 900; white-space: nowrap; }
  .calc-row .value.green { color: #3a7a4a; }
  .calc-row .value.red { color: #c62828; }
  .calc-row .value.neutral { color: var(--text); }

  .verdict-box {
    background: #f5e6d5;
    border-radius: 10px;
    padding: 16px;
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.7;
    color: #5a3e2b;
  }

  .verdict-box .verdict-label {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }

  .result-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  .result-section h3 {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 14px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .result-section ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .result-section ul li {
    font-size: 14px;
    line-height: 1.6;
    padding-left: 20px;
    position: relative;
    color: #3a2e26;
  }

  .result-section ul li::before {
    content: '✔';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-size: 12px;
  }

  .warning-box {
    background: #fdf3e3;
    border: 1px solid #e0c9a0;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 13px;
    line-height: 1.7;
    color: #6b4e2a;
    margin-bottom: 16px;
  }

  .warning-box strong { display: block; margin-bottom: 4px; font-size: 14px; }

  .retry-btn {
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    color: var(--text-muted);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .retry-btn:hover { border-color: var(--text-muted); color: var(--text); }

  .consult-section {
    margin-top: 48px;
    border-top: 1px solid var(--border);
    padding-top: 40px;
  }

  .consult-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 12px;
  }

  .consult-title {
    font-size: 20px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .consult-sub {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .form-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #b07d5b, #c9a97a);
    border: none;
    border-radius: 14px;
    padding: 20px;
    color: #fff;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 16px;
    font-weight: 900;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1.4;
  }

  .form-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(176,125,91,0.25);
  }

  .form-btn span {
    display: block;
    font-size: 12px;
    font-weight: 400;
    opacity: 0.85;
    margin-top: 4px;
  }

  .noriko-sign {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 32px;
    font-family: 'DM Mono', monospace;
  }

  .hidden { display: none !important; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    0%   { transform: scale(0.5); opacity: 0; }
    70%  { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="tag">のり式 診断ツール</div>
    <h1>あなたにぴったりの<br><span>iPhoneストレージ</span>、わかる。</h1>
    <p>7問答えるだけ。<br>あなたの場合の費用計算も出します。</p>
  </div>

  <div id="quiz-area">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>
    <div class="progress-label" id="progress-label">0 / 7</div>

    <div class="question-card" id="question-card">
      <div class="question-num" id="q-num">Q1</div>
      <div class="question-text" id="q-text"></div>
      <div class="question-sub" id="q-sub"></div>
      <div class="choices" id="choices"></div>
    </div>
  </div>

  <div id="result-area" class="hidden result-card"></div>

  <div class="consult-section">
    <div class="consult-label">無料相談</div>
    <div class="consult-title">スマホ選びやのりかえは<br>まず無料相談</div>
    <div style="text-align:center; font-size:24px; margin-bottom:8px;">👇</div>
    <div class="consult-sub">気になることがあったら<br>気軽に送ってね。</div>
    <a class="form-btn" href="https://docs.google.com/forms/d/1CGsa3q39FNZA7BAqxLlL7n38owE1a1vG-XQ3E3BjYu4/viewform" target="_blank" rel="noopener">
      📩 無料相談フォームを開く
      <span>タップするとGoogleフォームが開きます</span>
    </a>
  </div>

  <div class="noriko-sign">スマホのりかえ相談屋　のり</div>
</div>

<script>
const questions = [
  {
    key: 'storage',
    text: 'iPhoneの本体ストレージ、今どのくらい空いてる？',
    sub: '設定 → 一般 → iPhoneストレージ で確認できるよ',
    choices: [
      { icon: '😎', label: '20GB以上余ってる', note: '余裕あり', val: 'plenty' },
      { icon: '😅', label: '5〜20GB くらい', note: 'まあまあ', val: 'medium' },
      { icon: '😱', label: '5GB以下でギリギリ', note: 'やばい', val: 'low' },
      { icon: '🤷', label: 'よくわからない', note: '確認してない', val: 'unknown' },
    ]
  },
  {
    key: 'iphone_gb',
    text: '今使ってるiPhoneの容量は？',
    sub: '設定 → 一般 → 情報 で確認できるよ',
    choices: [
      { icon: '📱', label: '64GB', note: '旧モデルに多い', val: 64 },
      { icon: '📱', label: '128GB', note: '一番多いサイズ', val: 128 },
      { icon: '📱', label: '256GB', note: 'ちょっと大きめ', val: 256 },
      { icon: '📱', label: '512GB以上', note: '大容量モデル', val: 512 },
    ]
  },
  {
    key: 'photo',
    text: '写真や動画って、大切にしてる？',
    sub: '消えたらショック？正直に答えてね',
    choices: [
      { icon: '😍', label: '絶対消えてほしくない！', note: '思い出は全部残したい', val: 'precious' },
      { icon: '🙂', label: 'まあ大切かな', note: '消えたらちょっと悲しい', val: 'moderate' },
      { icon: '😶', label: '正直、どーでもいい', note: '消えても仕方ない', val: 'dontcare' },
    ]
  },
  {
    key: 'pc',
    text: 'パソコン、持ってる？',
    sub: 'MacでもWindowsでもOK',
    choices: [
      { icon: '💻', label: '持ってる', note: 'ケーブルつないでバックアップできる', val: 'yes' },
      { icon: '📱', label: '持ってない', note: 'スマホだけで生活してる', val: 'no' },
    ]
  },
  {
    key: 'years',
    text: '今のiPhoneをあと何年使う予定？',
    sub: '買い替えのタイミングを教えてね',
    choices: [
      { icon: '🔜', label: '1年以内に買い替えたい', note: 'もうすぐ変える', val: 1 },
      { icon: '📅', label: '2〜3年は使いたい', note: 'まだしばらく使う', val: 2.5 },
      { icon: '😌', label: '3年以上使いたい', note: 'できるだけ長く', val: 4 },
      { icon: '🤷', label: 'まだわからない', note: '決めてない', val: 2 },
    ]
  },
  {
    key: 'paying',
    text: '今、iCloudに課金してる？',
    sub: '設定 → Apple ID → iCloud → ストレージを管理 で確認できるよ',
    choices: [
      { icon: '💳', label: 'してる（50GB・月150円）', note: '月150円', val: 150 },
      { icon: '💳', label: 'してる（200GB・月450円）', note: '月450円', val: 450 },
      { icon: '💳', label: 'してる（2TB・月1,500円）', note: '月1,500円', val: 1500 },
      { icon: '🆓', label: 'してない（無料の5GB）', note: '課金なし', val: 0 },
      { icon: '🤷', label: 'よくわからない', note: '確認してない', val: -1 },
    ]
  },
  {
    key: 'storage_content',
    condition: a => a.paying === 1500,
    text: '2TBも使ってるのは、主に何？',
    sub: '一番多そうなものを選んでね',
    choices: [
      { icon: '📸', label: '写真・動画', note: '思い出の記録がメイン', val: 'photos' },
      { icon: '📱', label: '複数デバイスのバックアップ', note: '古いiPhoneのデータも残してる', val: 'backup' },
      { icon: '📁', label: '書類・ファイル類', note: 'PDFや資料など', val: 'files' },
      { icon: '🤷', label: 'よくわからない', note: '確認したことがない', val: 'unknown' },
    ]
  },
  {
    key: 'kiki',
    text: '機種変するとしたら、何GBに上げたい？',
    sub: '次に買うiPhoneのイメージを教えてね',
    choices: [
      { icon: '📦', label: '128GB（今と同じくらい）', note: '目安：約11〜13万円台', val: { gb: 128, price: 115000 } },
      { icon: '📦', label: '256GBに上げたい', note: '目安：約14〜18万円台', val: { gb: 256, price: 145000 } },
      { icon: '📦', label: '512GBに上げたい', note: '目安：約20〜22万円台', val: { gb: 512, price: 205000 } },
      { icon: '🤷', label: 'まだ決めてない', note: '256GBで計算します', val: { gb: 256, price: 145000 } },
    ]
  },
];

let answers = {};
let current = 0;

function getActiveQuestions() {
  return questions.filter(q => !q.condition || q.condition(answers));
}

function renderQuestion() {
  const active = getActiveQuestions();
  const q = active[current];
  const total = active.length;
  const pct = (current / total) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${current} / ${total}`;
  document.getElementById('q-num').textContent = `Q${current + 1}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-sub').textContent = q.sub;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `
      <span class="choice-icon">${c.icon}</span>
      <span class="choice-body">
        <span class="choice-label">${c.label}</span>
        <span class="choice-note">${c.note}</span>
      </span>`;
    btn.addEventListener('click', () => {
      answers[q.key] = c.val;
      current++;
      const newActive = getActiveQuestions();
      if (current < newActive.length) {
        const card = document.getElementById('question-card');
        card.style.animation = 'none';
        card.offsetHeight;
        card.style.animation = '';
        renderQuestion();
      } else {
        showResult();
      }
    });
    choicesEl.appendChild(btn);
  });
}

function getResultKey() {
  const a = answers;
  if (a.storage === 'low') return 'danger';
  if (a.paying === 1500) return 'need_2tb';
  if (a.photo === 'dontcare' && (a.storage === 'plenty' || a.storage === 'medium') && a.paying > 0) return 'unnecessary';
  if (a.photo === 'dontcare' && a.paying <= 0) return 'delete_photos';
  if (a.pc === 'yes' && a.photo !== 'precious') return 'pc_backup';
  if (a.years === 1) return 'short_term';
  if (a.photo === 'precious' && a.pc === 'no') return 'need_icloud';
  return 'consider';
}

function buildCalcBox() {
  const a = answers;
  const years = typeof a.years === 'number' ? a.years : 2;
  const months = Math.round(years * 12);
  const kikaiPrice = a.kiki && a.kiki.price ? a.kiki.price : 145000;
  const kikaiGB = a.kiki && a.kiki.gb ? a.kiki.gb : 256;

  const yearsLabel = years === 1 ? '約1年（12ヶ月）'
    : years === 2.5 ? '約2〜3年（30ヶ月）'
    : years >= 4 ? '3年以上（48ヶ月）'
    : '約2年（24ヶ月）';

  // 2TBユーザー専用：本体容量アップ＋プランダウングレードの比較
  if (a.paying === 1500) {
    const currentTotal = 1500 * months;
    const altIcloud = 450 * months;
    const altTotal = kikaiPrice + altIcloud;
    const annualSaving = (1500 - 450) * 12;
    return `
      <div class="calc-box">
        <h3>💰 あなたの場合の計算</h3>
        <div class="calc-row">
          <span class="label">今後の使用予定</span>
          <span class="value neutral">${yearsLabel}</span>
        </div>
        <div class="calc-row">
          <span class="label">2TB継続コスト<br>（1,500円 × ${months}ヶ月）</span>
          <span class="value red">約${currentTotal.toLocaleString()}円</span>
        </div>
        <div class="calc-row">
          <span class="label">${kikaiGB}GB買い替え＋200GBプラン<br>（${kikaiPrice.toLocaleString()}円＋450円×${months}ヶ月）</span>
          <span class="value neutral">約${altTotal.toLocaleString()}円</span>
        </div>
        <div class="calc-row">
          <span class="label">データ整理で200GBに<br>落とせた場合の年間節約</span>
          <span class="value green">約${annualSaving.toLocaleString()}円/年</span>
        </div>
        <div class="verdict-box">
          <span class="verdict-label">のり式 判定</span>
          <strong>📁 2TBは本体では代替できない。</strong><br>
          iPhoneの最大容量は512GBなので、2TBのデータを本体に入れることは不可能。iCloudは継続前提。ただし不要な動画や重複写真を整理して200GBに落とせれば年間${annualSaving.toLocaleString()}円の節約になる。本体を${kikaiGB}GBに上げると操作が快適になるが、節約目的ではなく「快適さへの投資」として考えて。
        </div>
      </div>`;
  }

  const icloudMonthly = a.paying === 150 ? 150 : 450;
  const icloudPlanLabel = a.paying === 150 ? '50GB' : '200GB';
  const icloudTotal = icloudMonthly * months;
  const icloudCheaper = icloudTotal < kikaiPrice;
  const diff = Math.abs(icloudTotal - kikaiPrice).toLocaleString();

  let verdictText = '';
  if (icloudCheaper) {
    verdictText = `<strong>✅ あなたの場合、iCloud課金がお得！</strong><br>買い替えより約${diff}円安くすみます。${years <= 1 ? '機種変まではiCloudで乗り切って。' : 'その間しっかり写真を守れる。'}`;
  } else {
    verdictText = `<strong>🔄 買い替えを検討してもいいタイミング。</strong><br>iCloudを${months}ヶ月払い続けるより、${kikaiGB}GBへの買い替えの方が約${diff}円の差。長く使うなら大容量モデルへの投資もアリ。`;
  }

  return `
    <div class="calc-box">
      <h3>💰 あなたの場合の計算</h3>
      <div class="calc-row">
        <span class="label">今後の使用予定</span>
        <span class="value neutral">${yearsLabel}</span>
      </div>
      <div class="calc-row">
        <span class="label">iCloud継続コスト<br>（${icloudPlanLabel} × ${months}ヶ月）</span>
        <span class="value ${icloudCheaper ? 'green' : 'red'}">約${icloudTotal.toLocaleString()}円</span>
      </div>
      <div class="calc-row">
        <span class="label">${kikaiGB}GBへの<br>買い替え目安</span>
        <span class="value ${icloudCheaper ? 'red' : 'green'}">約${kikaiPrice.toLocaleString()}円〜</span>
      </div>
      <div class="verdict-box">
        <span class="verdict-label">のり式 判定</span>
        ${verdictText}
      </div>
    </div>`;
}
