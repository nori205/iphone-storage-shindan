<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhoneストレージ診断 | のりこ式</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ee;
    --surface: #fff9f4;
    --surface2: #f0e9e0;
    --accent: #b07d5b;
    --accent2: #c9a97a;
    --text: #3a2e26;
    --text-muted: #9c8878;
    --border: #e0d4c8;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* bg grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeUp 0.6s ease both;
  }

  .header .tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    border-radius: 100px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .header h1 {
    font-size: clamp(24px, 6vw, 36px);
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 12px;
  }

  .header h1 span {
    color: var(--accent);
  }

  .header p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  /* progress */
  .progress-bar {
    height: 3px;
    background: var(--surface2);
    border-radius: 100px;
    margin-bottom: 40px;
    overflow: hidden;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    margin-top: 6px;
    margin-bottom: 32px;
  }

  /* question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 24px;
    animation: fadeUp 0.5s ease both;
  }

  .question-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .question-sub {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  /* choices */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .choice-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .choice-btn .choice-icon {
    font-size: 20px;
    flex-shrink: 0;
  }

  .choice-btn .choice-body {}
  .choice-btn .choice-label { display: block; }
  .choice-btn .choice-note {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .choice-btn:hover {
    border-color: var(--accent);
    background: #f5ece0;
    transform: translateX(4px);
  }

  .choice-btn.selected {
    border-color: var(--accent);
    background: #f5ece0;
  }

  /* result */
  .result-card {
    animation: fadeUp 0.6s ease both;
  }

  .result-hero {
    background: linear-gradient(135deg, #fff4eb 0%, #f5e6d5 100%);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 40px 32px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .result-hero::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(176,125,91,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .result-emoji {
    font-size: 56px;
    margin-bottom: 16px;
    display: block;
    animation: bounce 0.6s 0.3s ease both;
  }

  .result-type {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .result-title {
    font-size: 26px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 16px;
  }

  .result-desc {
    font-size: 14px;
    color: #ccc;
    line-height: 1.8;
    text-align: left;
  }

  .result-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  .result-section h3 {
    font-size: 13px;
    font-weight: 700;
    color: #8a6a3a;
    margin-bottom: 14px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .result-section ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .result-section ul li {
    font-size: 14px;
    line-height: 1.6;
    padding-left: 20px;
    position: relative;
    color: #ddd;
  }

  .result-section ul li::before {
    content: '✔';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-size: 12px;
  }

  .warning-box {
    background: #fdf3e3;
    border: 1px solid #e0c9a0;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 13px;
    line-height: 1.7;
    color: #8a6a3a;
    margin-bottom: 16px;
  }

  .warning-box strong { display: block; margin-bottom: 4px; font-size: 14px; }

  /* retry */
  .retry-btn {
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    color: var(--text-muted);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .retry-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .noriko-sign {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 40px;
    font-family: 'DM Mono', monospace;
  }

  .consult-section {
    margin-top: 48px;
    border-top: 1px solid var(--border);
    padding-top: 40px;
  }

  .consult-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 12px;
  }

  .consult-title {
    font-size: 20px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .consult-sub {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .form-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #b07d5b, #c9a97a);
    border: none;
    border-radius: 14px;
    padding: 20px;
    color: #fff;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 16px;
    font-weight: 900;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1.4;
  }

  .form-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(176,125,91,0.25);
  }

  .form-btn span {
    display: block;
    font-size: 12px;
    font-weight: 400;
    opacity: 0.85;
    margin-top: 4px;
  }

  /* animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    0%   { transform: scale(0.5); opacity: 0; }
    70%  { transform: scale(1.1); }
    100% { transform: scale(1);   opacity: 1; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="tag">のり式 診断ツール</div>
    <h1>あなたにぴったりの<br><span>iPhoneストレージ</span>、わかる。</h1>
    <p>5問答えるだけ。<br>無駄な課金、してない？正直に教えるね。</p>
  </div>

  <!-- Quiz -->
  <div id="quiz-area">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>
    <div class="progress-label" id="progress-label">0 / 5</div>

    <div class="question-card" id="question-card">
      <div class="question-num" id="q-num">Q1</div>
      <div class="question-text" id="q-text"></div>
      <div class="question-sub" id="q-sub"></div>
      <div class="choices" id="choices"></div>
    </div>
  </div>

  <!-- Result -->
  <div id="result-area" class="hidden result-card"></div>

  <div class="consult-section">
    <div class="consult-label">無料相談</div>
    <div class="consult-title">容量やのりかえの<br>無料相談はこちら</div>
    <div class="consult-sub">気になることがあったら<br>気軽に送ってね。</div>
    <a class="form-btn" href="https://docs.google.com/forms/d/1CGsa3q39FNZA7BAqxLlL7n38owE1a1vG-XQ3E3BjYu4/viewform" target="_blank" rel="noopener">
      📩 無料相談フォームを開く
      <span>タップするとGoogleフォームが開きます</span>
    </a>
  </div>

  <div class="noriko-sign" style="margin-top:32px;">スマホのりかえ相談屋　のり</div>
</div>

<script>
const questions = [
  {
    text: "iPhoneの本体ストレージ、今どのくらい空いてる？",
    sub: "設定 → 一般 → iPhoneストレージ で確認できるよ",
    choices: [
      { icon: "😎", label: "20GB以上余ってる", note: "余裕あり", val: "plenty" },
      { icon: "😅", label: "5〜20GB くらい", note: "まあまあ", val: "medium" },
      { icon: "😱", label: "5GB以下でギリギリ", note: "やばい", val: "low" },
      { icon: "🤷", label: "よくわからない", note: "確認してない", val: "unknown" },
    ]
  },
  {
    text: "写真や動画って、大切にしてる？",
    sub: "消えたらショック？正直に答えてね",
    choices: [
      { icon: "😍", label: "絶対消えてほしくない！", note: "思い出は全部残したい", val: "precious" },
      { icon: "🙂", label: "まあ大切かな", note: "消えたらちょっと悲しい", val: "moderate" },
      { icon: "😶", label: "正直、どーでもいい", note: "消えても仕方ない", val: "dontcare" },
    ]
  },
  {
    text: "パソコン、持ってる？",
    sub: "MacでもWindowsでもOK",
    choices: [
      { icon: "💻", label: "持ってる", note: "ケーブルつないでバックアップできる", val: "yes" },
      { icon: "📱", label: "持ってない", note: "スマホだけで生活してる", val: "no" },
    ]
  },
  {
    text: "今後1〜2年で機種変する予定ある？",
    sub: "iPhoneの買い替えのこと",
    choices: [
      { icon: "🔜", label: "ある、もうすぐ変える", note: "1年以内くらい", val: "soon" },
      { icon: "🤔", label: "たぶんある、いつかは", note: "2〜3年くらい先かな", val: "maybe" },
      { icon: "😌", label: "当分しない", note: "まだ使い続ける", val: "nope" },
    ]
  },
  {
    text: "今、iCloudに課金してる？",
    sub: "毎月150円とか450円とか引き落とされてたら課金してる",
    choices: [
      { icon: "💳", label: "してる", note: "毎月引き落とされてる", val: "paying" },
      { icon: "🆓", label: "してない（無料の5GB）", note: "課金なし", val: "free" },
      { icon: "🤷", label: "よくわからない", note: "確認してない", val: "unknown" },
    ]
  },
];

const results = {
  unnecessary_paying: {
    emoji: "😲",
    type: "もったいないタイプ",
    title: "課金、やめていいかもしれない。",
    desc: "本体に余裕があって、写真もそこまで大切じゃないなら、iCloudへの課金は不要な可能性が高い。Appleの警告画面に流されて、なんとなく課金してない？まず設定を見直してみて。",
    actions: [
      "設定 → 写真 → iCloud写真をオフにする",
      "解約前に「オリジナルをダウンロード」で本体に写真を戻す",
      "くるくるが消えたら解約してOK",
    ],
    warning: null
  },
  need_icloud: {
    emoji: "☁️",
    type: "iCloud必要タイプ",
    title: "課金は正解。設定を確認して。",
    desc: "写真を大切にしてて、パソコンもない。iCloudへの課金はあなたにとって正しい選択。ただし設定が正しくできてないと意味がない。今すぐ確認してみて。",
    actions: [
      "設定 → 写真 → iCloud写真がオンになってるか確認",
      "設定 → 写真 → iPhoneストレージを最適化もオンに",
      "WiFiにつないで充電しながら、くるくるが消えるのを待つ",
      "本体の空きが5GB以下になる前に課金すること！",
    ],
    warning: "⚠️ 本体がカツカツになりすぎると課金してもアップロードできなくなる。空きが5GB以下になったらすぐ動いて。"
  },
  pc_backup: {
    emoji: "💻",
    type: "パソコン活用タイプ",
    title: "iCloudいらない。パソコンで十分。",
    desc: "パソコンがあるなら、わざわざiCloudに課金しなくていい。ケーブルでつないでバックアップすれば、写真も設定も全部守れる。機種変のときもパソコン経由でOK。",
    actions: [
      "Macなら「Finder」、WindowsならiTunesでバックアップ",
      "iCloud写真はオフでOK",
      "機種変のときはパソコンでバックアップ → 新iPhoneに復元",
    ],
    warning: null
  },
  kiki_only: {
    emoji: "🎯",
    type: "機種変のときだけタイプ",
    title: "機種変前だけ課金する、が正解。",
    desc: "普段は無料の5GBで十分。機種変の1〜2ヶ月前だけ課金して、写真を全部クラウドに上げてから移行するのが一番賢い使い方。終わったら忘れずに解約してね。",
    actions: [
      "機種変の1〜2ヶ月前に課金開始",
      "iCloud写真をオンにしてWiFiでアップロード",
      "くるくるが消えたら機種変してOK",
      "移行後は忘れずに解約！",
    ],
    warning: "⚠️ 解約のし忘れに注意。課金しっぱなしになってる人、めちゃくちゃ多い(ﾉ_ _)ﾉ"
  },
  danger_zone: {
    emoji: "🚨",
    type: "今すぐ動いてタイプ",
    title: "急いで！本体がやばい状態。",
    desc: "本体の空きがほぼない状態は危険。このままだと写真の追加もできないし、課金してもアップロードできない可能性がある。今すぐ対処して。",
    actions: [
      "まず設定 → 一般 → iPhoneストレージで状況を確認",
      "使ってないアプリを削除して少し空きを作る",
      "iCloudに課金してiCloud写真をオンにする",
      "WiFi＋充電でくるくるが消えるのを待つ",
    ],
    warning: "⚠️ 本体の空きが1〜2GBを切ると、アップロードの作業スペースがなくなって処理が止まる。まず少し空きを作ってから課金してみて。"
  },
};

let answers = [];
let current = 0;

function getResult(ans) {
  const storage = ans[0];
  const photo = ans[1];
  const pc = ans[2];
  const kiki = ans[3];
  const paying = ans[4];

  // 本体がやばい
  if (storage === 'low' || storage === 'unknown' && paying === 'free') {
    if (photo === 'precious') return 'danger_zone';
  }
  if (storage === 'low') return 'danger_zone';

  // パソコンあり＋写真大切じゃない
  if (pc === 'yes' && photo !== 'precious') return 'pc_backup';

  // 写真どうでもいい＋本体余裕あり
  if (photo === 'dontcare' && (storage === 'plenty' || storage === 'medium')) {
    return 'unnecessary_paying';
  }

  // 機種変予定あり＋写真moderate以下＋PC持ち
  if (kiki === 'soon' && pc === 'yes') return 'kiki_only';

  // 写真大切＋PCなし
  if (photo === 'precious' && pc === 'no') return 'need_icloud';

  // 写真大切＋PCあり
  if (photo === 'precious' && pc === 'yes') return 'kiki_only';

  // 課金してるのに余裕あり＋写真どーでもいい
  if (paying === 'paying' && storage === 'plenty' && photo !== 'precious') {
    return 'unnecessary_paying';
  }

  return 'need_icloud';
}

function renderQuestion() {
  const q = questions[current];
  const pct = (current / questions.length) * 100;

  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${current} / ${questions.length}`;
  document.getElementById('q-num').textContent = `Q${current + 1}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-sub').textContent = q.sub;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';

  q.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `
      <span class="choice-icon">${c.icon}</span>
      <span class="choice-body">
        <span class="choice-label">${c.label}</span>
        <span class="choice-note">${c.note}</span>
      </span>
    `;
    btn.addEventListener('click', () => {
      answers.push(c.val);
      current++;
      if (current < questions.length) {
        // re-animate
        const card = document.getElementById('question-card');
        card.style.animation = 'none';
        card.offsetHeight;
        card.style.animation = '';
        renderQuestion();
      } else {
        showResult();
      }
    });
    choicesEl.appendChild(btn);
  });
}

function showResult() {
  document.getElementById('quiz-area').classList.add('hidden');
  const key = getResult(answers);
  const r = results[key];
  const area = document.getElementById('result-area');
  area.classList.remove('hidden');

  const warningHtml = r.warning
    ? `<div class="warning-box"><strong>注意</strong>${r.warning}</div>`
    : '';

  area.innerHTML = `
    <div class="result-hero">
      <span class="result-emoji">${r.emoji}</span>
      <div class="result-type">${r.type}</div>
      <div class="result-title">${r.title}</div>
      <div class="result-desc">${r.desc}</div>
    </div>

    ${warningHtml}

    <div class="result-section">
      <h3>やること</h3>
      <ul>
        ${r.actions.map(a => `<li>${a}</li>`).join('')}
      </ul>
    </div>

    <button class="retry-btn" onclick="restart()">もう一度診断する</button>
  `;
}

function restart() {
  answers = [];
  current = 0;
  document.getElementById('result-area').classList.add('hidden');
  document.getElementById('result-area').innerHTML = '';
  document.getElementById('quiz-area').classList.remove('hidden');
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
